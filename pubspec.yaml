name: class_management_starter
description: >
  Professional Flutter starter foundation for a future Class Management
  System. Establishes UI architecture, theming, navigation, reusable
  components, and animation patterns without implementing business logic.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

# ---------------------------------------------------------------------------
# DEPENDENCIES
#
# Everything is built with Flutter's own SDK (AnimationController,
# ChangeNotifier, InheritedNotifier, Navigator, MediaQuery, ...) except for
# the three additions below. Each one is justified by the same three
# questions: why is it required, what problem does it solve, and could
# Flutter's built-in functionality do the job instead?
#
# flutter_localizations (part of the Flutter SDK, not a third party)
#   Why:      the app can switch to Hindi, and Flutter's own widgets (date
#             pickers, tooltips, back-button labels, text selection menus)
#             need translations for the active locale.
#   Solves:   without it, MaterialApp cannot resolve MaterialLocalizations
#             for any locale other than English and widgets assert.
#   Built-in: this IS the built-in mechanism; the app's own text lives in
#             core/localization instead of ARB files, so no code generation
#             or `intl` dependency is needed.
#
# shared_preferences (published by the Flutter team)
#   Why:      theme, language and time zone must survive an app restart.
#   Solves:   key-value persistence on Android, iOS and web behind one API.
#   Built-in: no. dart:io file access needs a platform directory path,
#             which itself requires a plugin, and is unavailable on web.
#
# timezone
#   Why:      the greeting follows a user-selected time zone.
#   Solves:   Dart's DateTime only knows UTC and the device's zone. This
#             package bundles the IANA database, so daylight-saving rules
#             are always correct. Hand-maintained fixed offsets would be
#             wrong for part of every year in DST regions.
#   Built-in: no.
#
# A state-management package (Provider/Riverpod/Bloc) is still deliberately
# absent: SettingsController (a ChangeNotifier exposed through an
# InheritedNotifier) covers the only shared, mutable state the app has.
# ---------------------------------------------------------------------------
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.3.0
  timezone: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
